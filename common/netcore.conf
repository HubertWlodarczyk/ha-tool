# Controller of dut_sim (simulation only), on top of hci_ipc/extra-iso-bt_ll_sw_split.conf.
# leabench has its own trimmed configuration: leabench/netcore.conf.
CONFIG_BT_MAX_CONN=3
CONFIG_BT_CTLR_ADV_SET=3
CONFIG_BT_CTLR_CONN_ISO_STREAMS=2
CONFIG_BT_CTLR_CONN_ISO_STREAMS_PER_GROUP=2

# dut_sim only receives broadcasts (netcore_rx.conf); a CIS and a BIG sync share the ISO paths
CONFIG_BT_CTLR_ISO_TX_BUFFERS=10
CONFIG_BT_ISO_TX_BUF_COUNT=10
