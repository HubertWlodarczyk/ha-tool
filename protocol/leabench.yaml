  broadcast_warning:
    doc: 'A BIG started with --force: reason=interval_mix (next to a BIG of another interval) or over_budget (past the air time budget; cost_us, free_us); reason=layout: the controller laid the BIG out differently from what it asked for (rtn_air repetitions, bn PDUs per SDU)'
