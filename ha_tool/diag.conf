# Diagnostic build (scripts/build.sh dk --diag): measures the real stack use on the DK.
#   kernel thread stacks   used / size of every thread stack (stacks are filled at boot)
#   kernel thread list     threads and their state
# Run a full scenario (max broadcast, phone call, pairing), then read the maxima and size the
# stacks in prj.conf / the K_THREAD_DEFINEs to the measured value + 25 %.
CONFIG_KERNEL_SHELL=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
