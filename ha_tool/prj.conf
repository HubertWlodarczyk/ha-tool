# --- CLI (machine-parsable, no prompt/echo/colors) ---
CONFIG_SERIAL=y
# Interrupt driven in the simulation; the DK uses the async (DMA) API (boards/)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART=""
CONFIG_SHELL_ECHO_STATUS=n
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_CMD_BUFF_SIZE=256
CONFIG_SHELL_ARGC_MAX=24

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# No LC3 encoder and no floating point: tones are precomputed frames (src/lc3_frames.c)
CONFIG_UTF8=y

# --- Bluetooth host ---
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="HA-Tool"
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_PER_ADV=y
# One advertising set (extended + periodic) per broadcast
CONFIG_BT_EXT_ADV_MAX_ADV_SET=3
CONFIG_BT_MAX_CONN=3
# Virtual devices: one identity each (identity 0 is the tool itself)
CONFIG_BT_ID_MAX=9
CONFIG_BT_MAX_PAIRED=16
# Virtual devices use resolvable private addresses like real phones; each identity has its own
# IRK and every connection attempt a fresh RPA. Build with -DCONFIG_BT_PRIVACY=n for fixed
# (identity) addresses, e.g. for a sniffer.
CONFIG_BT_PRIVACY=y
CONFIG_BT_ATT_TX_COUNT=12
CONFIG_BT_L2CAP_TX_BUF_COUNT=20

# --- LE Audio ---
CONFIG_BT_AUDIO=y
CONFIG_BT_ISO_CENTRAL=y
CONFIG_BT_ISO_BROADCASTER=y
# ISO TX buffers: as many as the controller has (ha_tool/netcore.conf).
# Channels: the BISes of all broadcasts (HA_BCAST_MAX_BIS_TOTAL) + 2 CIS (BUILD_ASSERT in
# src/bcast/internal.h)
CONFIG_BT_ISO_MAX_CHAN=18
CONFIG_BT_ISO_TX_BUF_COUNT=17
CONFIG_BT_ISO_TX_MTU=155
CONFIG_BT_CAP_INITIATOR=y
CONFIG_BT_CSIP_SET_COORDINATOR=y
CONFIG_BT_BAP_UNICAST_CLIENT=y
CONFIG_BT_BAP_UNICAST_CLIENT_GROUP_STREAM_COUNT=2
CONFIG_BT_BAP_UNICAST_CLIENT_ASE_SNK_COUNT=2
CONFIG_BT_BAP_UNICAST_CLIENT_ASE_SRC_COUNT=2
CONFIG_BT_BAP_BROADCAST_SOURCE=y
# Broadcast source counts are derived from HA_BCAST_* in ha_tool/Kconfig
CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=32
CONFIG_BT_PBP=y

# Phone side: call control (TBS), media control (MCS), volume control (VCP)
CONFIG_BT_TBS=y
CONFIG_BT_CCP_CALL_CONTROL_SERVER=y
CONFIG_BT_MCS=y
CONFIG_BT_MPL=y
CONFIG_MCTL=y
CONFIG_MCTL_LOCAL_PLAYER_CONTROL=y
CONFIG_MCTL_LOCAL_PLAYER_REMOTE_CONTROL=y
CONFIG_BT_VCP_VOL_CTLR=y

# --- No flash writes: identities, bonds and names live in RAM only. Without a flash driver
# writing is impossible; an automated test loop would wear the flash out in minutes. ---
CONFIG_FLASH=n
CONFIG_SETTINGS=n
CONFIG_BT_SETTINGS=n

# Link parameter control from the CLI
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y

# Hearing aid controls (companion app): presets, microphone, balance
CONFIG_BT_HAS_CLIENT=y
CONFIG_BT_MICP_MIC_CTLR=y
CONFIG_BT_AICS_CLIENT_MAX_INSTANCE_COUNT=1
CONFIG_BT_MICP_MIC_CTLR_MAX_AICS_INST=1
CONFIG_BT_VOCS_CLIENT_MAX_INSTANCE_COUNT=1
CONFIG_BT_VCP_VOL_CTLR_MAX_VOCS_INST=1

# Client support: unique chip id ('id'), runtime prompt for 'proto human'
CONFIG_HWINFO=y
CONFIG_SHELL_PROMPT_CHANGE=y
# 'help' comes from the protocol specification (cli_tree.c), not the shell's built-in one
CONFIG_SHELL_HELP_CMD=n
