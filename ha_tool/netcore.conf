# Bluetooth controller (Zephyr LL, hci_ipc) of ha_tool on the nRF5340 network core (64 KB RAM).
# Replaces the sample's extra-iso-bt_ll_sw_split.conf, which enables every role: only what
# ha_tool uses is kept, and the RAM goes to broadcast (BIGs / BISes).
#
#   kept:     central + CIS central (dev, phone), scanning to connect, broadcaster (extended +
#             periodic advertising + BIG, encrypted BIGs), coded PHY, TX power control
#   dropped:  peripheral (+ ISO), BIG reception, periodic sync, PAST, DTM, big scan buffers
#
# A CIS never runs at the same time as a BIG (ha_tool modes), so the ISO data paths and TX
# buffers are shared. The *_COUNT values below must match HA_BCAST_* in ha_tool/Kconfig.

# Stacks and heap (heap: PSA key derivation of encrypted BIGs)
CONFIG_ISR_STACK_SIZE=1536
CONFIG_IDLE_STACK_SIZE=256
CONFIG_MAIN_STACK_SIZE=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
# Heap users: the IPC virtqueues at boot and AES-CMAC (encrypted BIG keys); 1 KB is plenty
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_CBPRINTF_REDUCED_INTEGRAL=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y

# HCI buffers: commands and events are small, ACL only for GATT of the virtual devices
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_EVT_RX_COUNT=6
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_COUNT=3
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=1
CONFIG_BT_BUF_ACL_RX_SIZE=255

# Roles
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_PER_ADV=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_MAX_CONN=3
CONFIG_BT_ISO_BROADCASTER=y
CONFIG_BT_ISO_CENTRAL=y

# ISO data over HCI: one SDU per stream in flight per buffer (see BT_CTLR_ISO_TX_BUFFERS)
CONFIG_BT_ISO_TX_MTU=155
CONFIG_BT_ISO_MAX_CHAN=4

CONFIG_BT_LL_SW_SPLIT=y
CONFIG_BT_CTLR_DTM_HCI=n
CONFIG_BT_CTLR_ASSERT_HANDLER=y
CONFIG_BT_HCI_VS_FATAL_ERROR=y

CONFIG_BT_CTLR_RX_BUFFERS=3
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_CODED=y

# Advertising: one extended + periodic set per BIG (3 BIGs, no spare: a set is deleted before its
# BIG starts again); data buffers: one update per BIG in flight
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=191
CONFIG_BT_CTLR_SCAN_DATA_LEN_MAX=255
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ADV_AUX_PDU_BACK2BACK=y
CONFIG_BT_CTLR_ADV_SYNC_PDU_BACK2BACK=y
CONFIG_BT_CTLR_ADV_DATA_BUF_MAX=2
CONFIG_BT_CTLR_SCAN_AUX_SET=1
CONFIG_BT_CTLR_LOW_LAT_ULL=y

CONFIG_BT_CTLR_ADV_RESERVE_MAX=n
CONFIG_BT_CTLR_ADV_ISO_RESERVE_MAX=y
CONFIG_BT_CTLR_CENTRAL_RESERVE_MAX=n
CONFIG_BT_CTLR_EVENT_OVERHEAD_RESERVE_MAX=n
CONFIG_BT_CTLR_SLOT_RESERVATION_UPDATE=n
CONFIG_BT_CTLR_SCAN_UNRESERVED=y
CONFIG_BT_TICKER_NEXT_SLOT_GET_MATCH=y
CONFIG_BT_TICKER_EXT=y
CONFIG_BT_TICKER_EXT_SLOT_WINDOW_YIELD=y
CONFIG_BT_CTLR_LLCP_LOCAL_PROC_CTX_BUF_NUM=4

# ISO broadcaster (encrypted BIGs: CCM by the radio, keys derived once per BIG)
CONFIG_BT_CTLR_ADV_PERIODIC=y
CONFIG_BT_CTLR_ADV_ISO=y
CONFIG_BT_CTLR_ADV_ISO_SEQUENTIAL=y
CONFIG_BT_CTLR_ADV_ISO_INTERLEAVED=y
CONFIG_BT_CTLR_ADV_ISO_PDU_LEN_MAX=160
CONFIG_BT_CTLR_ADV_ISO_SET=3
CONFIG_BT_CTLR_ADV_SET=3
CONFIG_BT_CTLR_ADV_AUX_SET=3
CONFIG_BT_CTLR_ADV_SYNC_SET=3
CONFIG_BT_CTLR_ADV_ISO_STREAM_MAX=8
CONFIG_BT_CTLR_ADV_ISO_STREAM_COUNT=16

# Connected ISO: the phone's unicast audio (one sink + one source CIS)
CONFIG_BT_CTLR_CENTRAL_ISO=y
CONFIG_BT_CTLR_CONN_ISO_GROUPS=1
CONFIG_BT_CTLR_CONN_ISO_STREAMS=2
CONFIG_BT_CTLR_CONN_ISO_STREAMS_PER_GROUP=2
CONFIG_BT_CTLR_CONN_ISO_LOW_LATENCY_POLICY=y

# ISO TX: SDUs up to 155 octets (48_6), 2 per stream in flight
CONFIG_BT_CTLR_ISOAL_SOURCES=16
CONFIG_BT_CTLR_ISO_TX_BUFFERS=17
CONFIG_BT_ISO_TX_BUF_COUNT=17
# The BIS PDU is limited to min(ADV_ISO_PDU_LEN_MAX, ISO_TX_BUFFER_SIZE - 8): the buffer also holds
# the 8 octet SDU timestamp header. With 160 a 155 octet 48_6 SDU was split into 2 PDUs (BN=2):
# twice the air time and only 4 BISes per BIG (scripts/capacity.py accept).
CONFIG_BT_CTLR_ISO_TX_BUFFER_SIZE=163
CONFIG_BT_CTLR_ISO_TX_SDU_LEN_MAX=155

# ISO RX: the phone's microphone stream (source CIS)
CONFIG_BT_ISO_RX_MTU=160
CONFIG_BT_ISO_RX_BUF_COUNT=1
CONFIG_BT_CTLR_ISOAL_SINKS=1
CONFIG_BT_CTLR_ISO_RX_BUFFERS=2

CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y

# PSA crypto only for AES-CMAC (encrypted BIG key derivation): CSPRNG, ROM tables, 3 key slots
CONFIG_MBEDTLS_PSA_CRYPTO_EXTERNAL_RNG=y
CONFIG_MBEDTLS_AES_ROM_TABLES=y
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=3

# No pre-transmission subevents: BIG events only as long as BISes x (RTN+1) (Zephyr patch 0003);
# lets 4 BIGs share the 10 ms interval. Repetition is set per BIG with rtn= instead.
CONFIG_BT_CTLR_ADV_ISO_PTO_GROUP_COUNT=0
