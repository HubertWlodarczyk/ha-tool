[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leabench"
version = "0.2.0"
description = "Client for leabench, an LE Audio test bench on the nRF5340 DK"
requires-python = ">=3.9"
license = {text = "MPL-2.0"}
dependencies = ["pyserial>=3.4"]

[tool.setuptools]
packages = ["leabench"]

[tool.setuptools.package-data]
leabench = ["py.typed"]
