# Simulated device (device under test) for leabench development.

# --- CLI (same conventions as leabench) ---
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART=""
CONFIG_SHELL_ECHO_STATUS=n
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_CMD_BUFF_SIZE=256
CONFIG_SHELL_ARGC_MAX=16
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=2048

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_FPU=y
CONFIG_LIBLC3=y
CONFIG_UTF8=y

# --- Bluetooth ---
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="DUT-LEA"
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_PER_ADV_SYNC=y
CONFIG_BT_MAX_CONN=3
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_ATT_PREPARE_COUNT=1

# Small bond list, like a device. When full, the oldest bond is replaced
# (build with -DCONFIG_BT_KEYS_OVERWRITE_OLDEST=n to reject new bonds instead).
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# --- LE Audio acceptor ---
CONFIG_BT_AUDIO=y
CONFIG_BT_CAP_ACCEPTOR=y
CONFIG_BT_BAP_UNICAST_SERVER=y
CONFIG_BT_ISO_PERIPHERAL=y
CONFIG_BT_ISO_SYNC_RECEIVER=y
CONFIG_BT_ISO_MAX_CHAN=10
CONFIG_BT_ISO_RX_MTU=155
CONFIG_BT_ISO_TX_MTU=155
CONFIG_BT_ASCS=y
CONFIG_BT_ASCS_MAX_ASE_SNK_COUNT=2
CONFIG_BT_ASCS_MAX_ASE_SRC_COUNT=1
CONFIG_BT_PAC_SNK=y
CONFIG_BT_PAC_SNK_LOC=y
CONFIG_BT_PAC_SRC=y
CONFIG_BT_PAC_SRC_LOC=y
CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=32
CONFIG_BT_BAP_SCAN_DELEGATOR=y
CONFIG_BT_BAP_BROADCAST_SINK=y
CONFIG_BT_BAP_BROADCAST_SNK_STREAM_COUNT=8
CONFIG_BT_PBP=y

# Device controls: call control client, media control client, volume renderer
CONFIG_BT_TBS_CLIENT_GTBS=y
CONFIG_BT_CCP_CALL_CONTROL_CLIENT=y
CONFIG_BT_MCC=y
CONFIG_BT_VCP_VOL_REND=y
CONFIG_BT_ATT_TX_COUNT=16
CONFIG_BT_L2CAP_TX_BUF_COUNT=16
CONFIG_BT_BAP_BASS_MAX_SUBGROUPS=4
CONFIG_BT_BAP_BROADCAST_SNK_SUBGROUP_COUNT=4

# Bonds survive a restart (persistence tests)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_BT_SETTINGS=y

CONFIG_BT_USER_PHY_UPDATE=y

# Device services controlled by leabench: presets, microphone, balance
CONFIG_BT_HAS=y
CONFIG_BT_HAS_PRESET_COUNT=3
CONFIG_BT_MICP_MIC_DEV=y
CONFIG_BT_AICS_MAX_INSTANCE_COUNT=1
CONFIG_BT_MICP_MIC_DEV_AICS_INSTANCE_COUNT=1
CONFIG_BT_VOCS_MAX_INSTANCE_COUNT=1
CONFIG_BT_VCP_VOL_REND_VOCS_INSTANCE_COUNT=1
